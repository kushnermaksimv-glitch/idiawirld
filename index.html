<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат страны Мир Идиаканта</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #d1a374;
            background-image: radial-gradient(#e5c29f 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 85vh;
            background-color: #fff8f0;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(60, 40, 20, 0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid #b8860b;
            position: relative;
        }

        .chat-header {
            background: linear-gradient(135deg, #2c1d11, #573a23);
            color: #f3e5ab;
            padding: 15px 20px;
            border-bottom: 2px solid #b8860b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 1.1rem;
        }

        .logout-btn {
            background: #8b5a2b;
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* Экран авторизации */
        .auth-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #fff8f0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            gap: 15px;
        }

        .auth-screen h2 {
            color: #573a23;
            margin-bottom: 10px;
            text-align: center;
        }

        .auth-input {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            border: 1px solid #c8a27c;
            border-radius: 8px;
            outline: none;
        }

        .auth-btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 300px;
        }

        .auth-btn {
            flex: 1;
            padding: 12px;
            background-color: #573a23;
            color: #f3e5ab;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .auth-error {
            color: #b30000;
            font-size: 0.85rem;
            height: 15px;
        }

        /* Область сообщений */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #fdfaf6;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
            background-color: #eae0d5;
            color: #332211;
            align-self: flex-start;
        }

        .message.my-message {
            background-color: #573a23;
            color: #ffffff;
            align-self: flex-end;
        }

        .message-author {
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 3px;
            color: #8b5a2b;
        }

        .message.my-message .message-author {
            color: #f3e5ab;
        }

        .message-time {
            font-size: 0.65rem;
            opacity: 0.7;
            text-align: right;
            margin-top: 4px;
        }

        /* Форма ввода */
        .chat-input-area {
            display: flex;
            padding: 15px;
            background-color: #fff8f0;
            border-top: 1px solid #e5c29f;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #c8a27c;
            border-radius: 8px;
            outline: none;
        }

        .chat-input-area button {
            background-color: #573a23;
            color: #f3e5ab;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Окно Входа / Регистрации -->
        <div class="auth-screen" id="authScreen">
            <h2>🐾 Мир Идиаканта</h2>
            <input type="text" id="authUsername" class="auth-input" placeholder="Логин (Имя)" autocomplete="off">
            <input type="password" id="authPassword" class="auth-input" placeholder="Пароль">
            <div class="auth-error" id="authError"></div>
            <div class="auth-btn-group">
                <button class="auth-btn" id="loginBtn">Войти</button>
                <button class="auth-btn" id="regBtn" style="background-color: #8b5a2b;">Регистрация</button>
            </div>
        </div>

        <!-- Шапка -->
        <div class="chat-header">
            <h2 id="headerTitle">🐾 Чат Идиаканта</h2>
            <button class="logout-btn" id="logoutBtn">Выйти</button>
        </div>

        <!-- Сообщения -->
        <div class="chat-messages" id="chatMessages"></div>

        <!-- Поле ввода -->
        <form class="chat-input-area" id="chatForm">
            <input type="text" id="userInput" placeholder="Напишите сообщение..." autocomplete="off" required>
            <button type="submit">Отправить</button>
        </form>
    </div>

    <!-- Модули Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Конфигурация Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyByKktnwPbg1zBU4wYR8hceDc57BR0Y4Zo",
            authDomain: "worldidiakant.firebaseapp.com",
            databaseURL: "https://worldidiakant-default-rtdb.firebaseio.com",
            projectId: "worldidiakant",
            storageBucket: "worldidiakant.firebasestorage.app",
            messagingSenderId: "118297973184",
            appId: "1:118297973184:web:3bbf230075f71f6b66b825",
            measurementId: "G-FPZMTSWPDQ"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const messagesRef = ref(database, 'messages');
        const usersRef = ref(database, 'users');

        // Элементы UI
        const authScreen = document.getElementById('authScreen');
        const authUsername = document.getElementById('authUsername');
        const authPassword = document.getElementById('authPassword');
        const authError = document.getElementById('authError');
        const loginBtn = document.getElementById('loginBtn');
        const regBtn = document.getElementById('regBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const headerTitle = document.getElementById('headerTitle');
        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');

        let currentUser = localStorage.getItem('idiakant_user');

        // Авто-вход, если имя уже сохраненно
        if (currentUser) {
            authScreen.style.display = 'none';
            headerTitle.innerText = `🐾 Чат: ${currentUser}`;
        }

        // Регистрация
        regBtn.addEventListener('click', async () => {
            const username = authUsername.value.trim();
            const password = authPassword.value.trim();

            if (!username || !password) {
                authError.innerText = 'Заполните оба поля!';
                return;
            }

            const snapshot = await get(child(usersRef, username));
            if (snapshot.exists()) {
                authError.innerText = 'Пользователь с таким логином уже есть!';
            } else {
                // Сохраняем нового пользователя в Firebase
                const dbRef = ref(database, 'users/' + username);
                push(dbRef, { password: password });
                loginSuccess(username);
            }
        });

        // Вход
        loginBtn.addEventListener('click', async () => {
            const username = authUsername.value.trim();
            const password = authPassword.value.trim();

            if (!username || !password) {
                authError.innerText = 'Заполните оба поля!';
                return;
            }

            const snapshot = await get(child(usersRef, username));
            if (snapshot.exists()) {
                const userData = snapshot.val();
                const passKey = Object.keys(userData)[0];
                if (userData[passKey].password === password) {
                    loginSuccess(username);
                } else {
                    authError.innerText = 'Неверный пароль!';
                }
            } else {
                authError.innerText = 'Пользователь не найден!';
            }
        });

        function loginSuccess(username) {
            currentUser = username;
            localStorage.setItem('idiakant_user', username);
            authScreen.style.display = 'none';
            headerTitle.innerText = `🐾 Чат: ${username}`;
            authError.innerText = '';
        }

        // Выход
        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('idiakant_user');
            location.reload();
        });

        // Отправка сообщений
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = userInput.value.trim();

            if (text && currentUser) {
                const now = new Date();
                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                push(messagesRef, {
                    author: currentUser,
                    text: text,
                    time: timeStr
                });

                userInput.value = '';
            }
        });

        // Слушатель новых сообщений
        onChildAdded(messagesRef, (snapshot) => {
            const data = snapshot.val();
            
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');

            if (data.author === currentUser) {
                messageDiv.classList.add('my-message');
            }

            messageDiv.innerHTML = `
                <div class="message-author">${data.author}</div>
                <div>${data.text}</div>
                <div class="message-time">${data.time}</div>
            `;

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });
    </script>
</body>
</html>
