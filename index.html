<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мессенджер «Мир Идиаканта»</title>
    <style>
        :root {
            --bg-body: #2c1d11;
            --bg-container: #fff8f0;
            --bg-chats-list: #eae0d5;
            --bg-chat-active: #d1a374;
            --bg-window: #fdfaf6;
            --bg-header: linear-gradient(135deg, #2c1d11, #573a23);
            --bg-msg-other: #eae0d5;
            --bg-msg-my: #573a23;
            --text-main: #332211;
            --text-my: #ffffff;
            --text-header: #f3e5ab;
            --border-color: #b8860b;
            --font-size-msg: 0.9rem;
        }

        body.theme-dark {
            --bg-body: #121212;
            --bg-container: #1e1e1e;
            --bg-chats-list: #252525;
            --bg-chat-active: #383838;
            --bg-window: #181818;
            --bg-header: linear-gradient(135deg, #2a2a2a, #1f1f1f);
            --bg-msg-other: #2d2d2d;
            --bg-msg-my: #4a3b52;
            --text-main: #e0e0e0;
            --text-my: #ffffff;
            --text-header: #bb86fc;
            --border-color: #333333;
        }

        body.theme-light {
            --bg-body: #e0e6ed;
            --bg-container: #ffffff;
            --bg-chats-list: #f0f4f8;
            --bg-chat-active: #d9e2ec;
            --bg-window: #ffffff;
            --bg-header: linear-gradient(135deg, #334e68, #243b53);
            --bg-msg-other: #f0f4f8;
            --bg-msg-my: #334e68;
            --text-main: #102a43;
            --text-my: #ffffff;
            --text-header: #f0f4f8;
            --border-color: #bccadc;
        }

        body.theme-neon {
            --bg-body: #050515;
            --bg-container: #0a0a23;
            --bg-chats-list: #101035;
            --bg-chat-active: #1a1a4a;
            --bg-window: #070719;
            --bg-header: linear-gradient(135deg, #12002b, #28004d);
            --bg-msg-other: #16163d;
            --bg-msg-my: #0088cc;
            --text-main: #00ffcc;
            --text-my: #ffffff;
            --text-header: #ff007f;
            --border-color: #ff007f;
        }

        body.font-small { --font-size-msg: 0.8rem; }
        body.font-medium { --font-size-msg: 0.95rem; }
        body.font-large { --font-size-msg: 1.1rem; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .messenger-container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background-color: var(--bg-container);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            overflow: hidden;
            border: 2px solid var(--border-color);
            position: relative;
        }

        .sidebar-drawer {
            position: absolute;
            top: 0; left: -300px;
            width: 300px;
            height: 100%;
            background-color: var(--bg-container);
            color: var(--text-main);
            z-index: 30;
            border-right: 2px solid var(--border-color);
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 12px;
            overflow-y: auto;
        }

        .sidebar-drawer.active { left: 0; }

        .drawer-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 29;
            display: none;
        }

        .drawer-overlay.active { display: block; }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .setting-select {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-window);
            color: var(--text-main);
            outline: none;
        }

        .chats-list-panel {
            width: 320px;
            background-color: var(--bg-chats-list);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .chats-header {
            background: var(--bg-header);
            color: var(--text-header);
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-header);
            font-size: 1.3rem;
            cursor: pointer;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
            position: relative;
        }

        .chat-item:hover, .chat-item.active {
            background-color: var(--bg-chat-active);
        }

        .chat-item-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--bg-msg-my);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
        }

        .chat-item-info { flex: 1; overflow: hidden; }
        .chat-item-title { font-weight: bold; color: var(--text-main); font-size: 0.95rem; }
        .chat-item-sub { font-size: 0.8rem; opacity: 0.7; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .online-dot {
            width: 12px;
            height: 12px;
            background-color: #2ec4b6;
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            right: 2px;
            border: 2px solid var(--bg-chats-list);
            display: none;
        }
        .online-dot.active { display: block; }

        .chat-window {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-window);
            position: relative;
        }

        .chat-window-header {
            background: var(--bg-header);
            color: var(--text-header);
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--border-color);
            cursor: pointer;
        }

        .back-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-header);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .chat-status-text {
            font-size: 0.75rem;
            opacity: 0.8;
            font-weight: normal;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-x: hidden;
        }

        .message-row {
            display: flex;
            gap: 8px;
            max-width: 85%;
            position: relative;
            touch-action: pan-y;
            transition: transform 0.1s ease-out, background-color 0.3s ease, box-shadow 0.2s ease;
            cursor: pointer;
            border-radius: 12px;
            padding: 4px;
        }

        .message-row.msg-selected {
            background-color: rgba(255, 215, 0, 0.25) !important;
            box-shadow: 0 0 12px #ffd700;
        }

        .message-row.highlight-msg {
            animation: highlightPulse 2s ease-in-out;
        }

        @keyframes highlightPulse {
            0% { background-color: rgba(255, 215, 0, 0.5); transform: scale(1.02); }
            50% { background-color: rgba(255, 215, 0, 0.25); }
            100% { background-color: transparent; transform: scale(1); }
        }

        .message-row.my-msg {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg-chat-active);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .msg-bubble {
            background-color: var(--bg-msg-other);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: var(--font-size-msg);
            word-break: break-word;
            position: relative;
        }

        .my-msg .msg-bubble {
            background-color: var(--bg-msg-my);
            color: var(--text-my);
        }

        .msg-author { font-size: 0.75rem; font-weight: bold; opacity: 0.8; margin-bottom: 2px; }
        .msg-time { font-size: 0.65rem; opacity: 0.7; text-align: right; margin-top: 3px; }

        .edited-tag {
            font-size: 0.65rem;
            font-style: italic;
            opacity: 0.7;
            margin-left: 4px;
        }

        .sticker-img {
            max-width: 140px;
            max-height: 140px;
            border-radius: 8px;
            display: block;
            margin-top: 4px;
        }

        .typing-indicator-row {
            display: none;
            align-self: flex-start;
            margin-bottom: 5px;
        }
        .typing-indicator-row.active {
            display: flex;
        }
        .typing-bubble {
            background-color: var(--bg-msg-other);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-style: italic;
            opacity: 0.85;
            animation: pulseTyping 1.5s infinite;
        }

        @keyframes pulseTyping {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        .reply-preview-bubble {
            background: rgba(0,0,0,0.15);
            border-left: 3px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 5px;
            font-size: 0.8rem;
        }

        .interactive-box {
            background: #111;
            color: #fff;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #ffd700;
            text-align: center;
            display: inline-block;
            margin-top: 5px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .interactive-box:active { transform: scale(0.97); }

        .game-display {
            font-size: 1.8rem;
            letter-spacing: 3px;
            background: #222;
            padding: 5px 12px;
            border-radius: 6px;
            border: 1px solid #444;
            min-width: 140px;
        }
        .game-status {
            font-size: 0.75rem;
            color: #ffd700;
            margin-top: 4px;
            font-weight: bold;
        }

        .reply-bar {
            display: none;
            background: var(--bg-chats-list);
            color: var(--text-main);
            padding: 8px 12px;
            border-top: 1px solid var(--border-color);
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .reply-bar.active { display: flex; }
        .reply-bar-info { border-left: 3px solid var(--border-color); padding-left: 8px; flex:1; }
        .close-reply-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-main); }

        .action-fast-btn {
            background: var(--bg-header);
            color: var(--text-header);
            border: none;
            padding: 6px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .btn-danger {
            background: #d90429 !important;
            color: #fff !important;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            background-color: var(--bg-container);
            border-top: 1px solid var(--border-color);
            gap: 8px;
            align-items: center;
        }

        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background: var(--bg-window);
            color: var(--text-main);
            outline: none;
            user-select: text;
        }

        .chat-input-area button {
            background: var(--bg-header);
            color: var(--text-header);
            border: none;
            padding: 10px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* --- ПАНЕЛЬ СТИКЕРОВ --- */
        .stickers-panel {
            position: absolute;
            bottom: 60px;
            right: 10px;
            width: 320px;
            height: 280px;
            background: var(--bg-container);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            display: none;
            flex-direction: column;
            z-index: 25;
            padding: 10px;
            gap: 8px;
        }
        .stickers-panel.active { display: flex; }
        .stickers-tabs { display: flex; gap: 5px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }
        .sticker-tab-btn {
            background: var(--bg-chats-list);
            color: var(--text-main);
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .sticker-tab-btn.active {
            background: var(--bg-header);
            color: var(--text-header);
        }
        .stickers-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            overflow-y: auto;
            padding: 4px;
        }
        .sticker-item {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: transform 0.1s;
        }
        .sticker-item:hover { transform: scale(1.08); }

        .auth-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-container);
            color: var(--text-main);
            z-index: 40;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 12px;
        }

        .auth-input {
            width: 100%;
            max-width: 280px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-window);
            color: var(--text-main);
            outline: none;
            user-select: text;
        }

        .auth-btn {
            width: 100%;
            max-width: 280px;
            padding: 10px;
            background: var(--bg-header);
            color: var(--text-header);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .file-upload-btn {
            display: inline-block;
            padding: 8px 12px;
            background: var(--bg-chat-active);
            color: var(--text-main);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        /* --- МОДАЛЬНОЕ ОКНО "КТО В СЕТИ" --- */
        .online-modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 50;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .online-modal-overlay.active { display: flex; }
        .online-modal-card {
            background: var(--bg-container);
            color: var(--text-main);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            width: 90%;
            max-width: 320px;
            padding: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 70vh;
        }
        .online-modal-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 50vh;
        }

        @media (max-width: 650px) {
            .chats-list-panel { width: 100%; }
            .chat-window { display: none; width: 100%; }
            .messenger-container.open-chat .chats-list-panel { display: none; }
            .messenger-container.open-chat .chat-window { display: flex; }
            .back-btn { display: block; }
        }
    </style>
</head>
<body class="theme-classic font-medium">

    <div class="messenger-container" id="messenger">
        <div class="drawer-overlay" id="drawerOverlay"></div>

        <!-- МОДАЛКА ОНЛАЙН ИГРОКОВ -->
        <div class="online-modal-overlay" id="onlineModalOverlay">
            <div class="online-modal-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3 style="font-size:1.1rem;">🟢 Сейчас онлайн</h3>
                    <button class="close-reply-btn" id="closeOnlineModalBtn">✕</button>
                </div>
                <div class="online-modal-list" id="onlineModalList"></div>
            </div>
        </div>

        <!-- ШТОРКА НАСТРОЕК -->
        <div class="sidebar-drawer" id="sidebarDrawer">
            <h3>⚙️ Настройки</h3>
            
            <div style="text-align: center; margin: 5px 0;">
                <div id="drawerAvatar" class="chat-item-avatar" style="width:65px; height:65px; margin:0 auto; font-size:1.8rem;">🐱</div>
                <h4 id="drawerUsername" style="margin-top:5px;">Имя</h4>
            </div>

            <div class="setting-group">
                <label>Аватар (Эмодзи или Загрузить фото):</label>
                <input type="text" id="setAvatarInput" class="auth-input" placeholder="Введите эмодзи 😎">
                <div style="text-align:center; font-size:0.8rem; opacity:0.7;">или</div>
                <label class="file-upload-btn">
                    📷 Выбрать фото с устройства
                    <input type="file" id="avatarFileInput" accept="image/*" style="display:none;">
                </label>
                <button class="auth-btn" id="saveAvatarBtn" style="margin-top:5px;">Сохранить аватар</button>
            </div>

            <div class="setting-group">
                <label>Тема оформления:</label>
                <select id="themeSelect" class="setting-select">
                    <option value="theme-classic">🪵 Классическая</option>
                    <option value="theme-dark">🌙 Тёмная</option>
                    <option value="theme-light">☀️ Светлая</option>
                    <option value="theme-neon">⚡ Неоновая</option>
                </select>
            </div>

            <div class="setting-group">
                <label>Размер текста:</label>
                <select id="fontSelect" class="setting-select">
                    <option value="font-small">Мелкий</option>
                    <option value="font-medium" selected>Средний</option>
                    <option value="font-large">Крупный</option>
                </select>
            </div>

            <div style="flex:1;"></div>
            <button class="auth-btn" id="logoutBtn" style="opacity: 0.8;">Выйти</button>
        </div>

        <!-- ЭКРАН ВХОДА -->
        <div class="auth-screen" id="authScreen">
            <h2>🐾 Мир Идиаканта</h2>
            <input type="text" id="authUsername" class="auth-input" placeholder="Логин (Никнейм)">
            <input type="password" id="authPassword" class="auth-input" placeholder="Пароль">
            
            <div style="width:100%; max-width:280px; text-align:center;">
                <input type="text" id="authAvatar" class="auth-input" placeholder="Аватар (Эмодзи)">
                <div style="margin: 5px 0; font-size:0.8rem; opacity:0.7;">или загрузи фото:</div>
                <label class="file-upload-btn" style="width:100%;">
                    📁 Фото профиля (в текст)
                    <input type="file" id="authAvatarFile" accept="image/*" style="display:none;">
                </label>
            </div>

            <button class="auth-btn" id="startBtn">Войти в Мессенджер</button>
        </div>

        <div class="chats-list-panel">
            <div class="chats-header">
                <button class="menu-btn" id="openMenuBtn">☰</button>
                <h3>Идиакант TG</h3>
            </div>
            
            <div id="chatsList" style="overflow-y: auto; flex:1;">
                <div class="chat-item active" id="globalChatItem">
                    <div class="chat-item-avatar">📢</div>
                    <div class="chat-item-info">
                        <div class="chat-item-title">Общий чат страны</div>
                        <div class="chat-item-sub" id="globalTypingSub">Все жители Идиаканта</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-window">
            <div class="chat-window-header" id="chatWindowHeader">
                <button class="back-btn" id="backBtn">◄</button>
                <div class="msg-avatar" id="activeChatAvatar">📢</div>
                <div>
                    <h3 id="activeChatTitle" style="font-size:1rem;">Общий чат страны</h3>
                    <div class="chat-status-text" id="activeChatStatus">⚪ офлайн</div>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages"></div>

            <!-- ИНДИКАТОР ПЕЧАТИ В ЛЕНТЕ -->
            <div class="typing-indicator-row" id="typingIndicatorRow">
                <div class="msg-avatar" id="typingAvatar">✍️</div>
                <div class="typing-bubble" id="typingText">кто-то печатает...</div>
            </div>

            <!-- ПАНЕЛЬ СТИКЕРОВ -->
            <div class="stickers-panel" id="stickersPanel">
                <div class="stickers-tabs">
                    <button class="sticker-tab-btn active" id="tabGeneralStickers">📢 Общие</button>
                    <button class="sticker-tab-btn" id="tabMyPackStickers">➕ Мой пак</button>
                </div>

                <div id="packCreateArea" style="display:none; flex-direction:column; gap:5px; margin-bottom:5px;">
                    <input type="text" id="packNameInput" class="auth-input" style="padding:4px; font-size:0.8rem;" placeholder="Название пака">
                    <label class="file-upload-btn" style="padding:4px; font-size:0.8rem;">
                        🖼️ Добавить стикер (картинка -> текст)
                        <input type="file" id="stickerFileInput" accept="image/*" style="display:none;">
                    </label>
                </div>

                <div class="stickers-grid" id="stickersGrid"></div>
            </div>

            <div class="reply-bar" id="replyBar">
                <div class="reply-bar-info">
                    <div id="replyBarAuthor" style="font-weight:bold; font-size:0.75rem;">Автор</div>

        const firebaseConfig = {

            authDomain: "worldidiakant.firebaseapp.com",
            databaseURL: "https://worldidiakant-default-rtdb.firebaseio.com",
            projectId: "worldidiakant",
            storageBucket: "worldidiakant.firebasestorage.app",
            messagingSenderId: "118297973184",
            appId: "1:118297973184:web:3bbf230075f71f6b66b825",

        // ВСПУХИВАНИЕ КАРТИНКИ В ТЕКСТ (Base64)
        function convertFileToBase64(file, maxWidth = 250, maxHeight = 250) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width = Math.round((width * maxHeight) / height);
                                height = maxHeight;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // Возвращаем сжатый текст картинки
                        resolve(canvas.toDataURL('image/webp', 0.8));
                    };
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function renderAvatar(element, avatarData) {
            if (avatarData && (avatarData.startsWith('data:image/') || avatarData.startsWith('http://') || avatarData.startsWith('https://'))) {
                element.innerHTML = `<img src="${avatarData}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
            } else {
                element.innerText = avatarData || '🐱';
            }
        }

        // Загрузка фото для Аватарки при входе
        document.getElementById('authAvatarFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file) {
                const base64Text = await convertFileToBase64(file, 150, 150);
                document.getElementById('authAvatar').value = base64Text;
            }
        });

        // Загрузка фото для Аватарки в настройках
        document.getElementById('avatarFileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file) {
                const base64Text = await convertFileToBase64(file, 150, 150);
                document.getElementById('setAvatarInput').value = base64Text;
            }
        });

        document.getElementById('startBtn').addEventListener('click', async () => {
            const user = document.getElementById('authUsername').value.trim();
            const avatar = document.getElementById('authAvatar').value.trim() || '🐱';

            if (user) {
                currentUser = user;
                currentAvatar = avatar;
                localStorage.setItem('idi_user', user);
                localStorage.setItem('idi_avatar', avatar);

                await set(ref(database, 'users/' + user), { avatar: avatar });
                initApp();
            } else {
                alert("Введите никнейм!");
            }
        });

        function initApp() {
            authScreen.style.display = 'none';
            document.getElementById('drawerUsername').innerText = currentUser;
            renderAvatar(document.getElementById('drawerAvatar'), currentAvatar);
            
            setupPresence();
            loadUsersList();
            openChat('global', 'Общий чат страны', '📢');
            setupTypingEvents();
            loadStickers('general');

            onValue(ref(database, 'status'), () => {
                updateHeaderStatus();
            });
        }

        function setupPresence() {
            const myStatusRef = ref(database, 'status/' + currentUser);
            const connectedRef = ref(database, '.info/connected');

            onValue(connectedRef, (snap) => {
                if (snap.val() === true) {
                    onDisconnect(myStatusRef).set({ state: 'offline', last_changed: Date.now() });
                    set(myStatusRef, { state: 'online', last_changed: Date.now() });
                }
            });
        }

        function setupTypingEvents() {
            userInput.addEventListener('input', () => {
                if (!currentUser) return;
                set(ref(database, `typing/${activeChatId}/${currentUser}`), true);

                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    set(ref(database, `typing/${activeChatId}/${currentUser}`), false);
                }, 2000);
            });
        }

        function loadUsersList() {
            onChildAdded(ref(database, 'users'), (snapshot) => {
                const username = snapshot.key;
                const data = snapshot.val();
                allUsersData[username] = data;

                if (username !== currentUser && !document.getElementById('user-chat-' + username)) {
                    const chatItem = document.createElement('div');
                    chatItem.className = 'chat-item';
                    chatItem.id = 'user-chat-' + username;
                    chatItem.innerHTML = `
                        <div class="chat-item-avatar" id="avatar-col-${username}">
                            <div class="online-dot" id="dot-${username}"></div>
                        </div>
                        <div class="chat-item-info">
                            <div class="chat-item-title">${username}</div>
                            <div class="chat-item-sub" id="sub-${username}">Личные сообщения</div>
                        </div>
                    `;

                    chatItem.addEventListener('click', () => {
                        document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
                        chatItem.classList.add('active');
                        openChat(username, username, data.avatar);
                    });

                    chatsList.appendChild(chatItem);
                    renderAvatar(document.getElementById('avatar-col-' + username), data.avatar);

                    onValue(ref(database, 'status/' + username), (snap) => {
                        const statusData = snap.val();
                        const dot = document.getElementById('dot-' + username);
                        const isOnline = statusData && statusData.state === 'online';

                        if (dot) {
                            if (isOnline) dot.classList.add('active');
                            else dot.classList.remove('active');
                        }
                    });

                    onValue(ref(database, `typing/${username}/${username}`), (snap) => {
                        const isTyping = snap.val();
                        const sub = document.getElementById('sub-' + username);
                        if (sub) {
                            sub.innerText = isTyping ? '✍️ печатает...' : 'Личные сообщения';
                            sub.style.color = isTyping ? '#ffd700' : 'inherit';
                        }
                        if (activeChatId === username) {
                            toggleInMessageTyping(username, isTyping);
                        }
                    });
                }
            });

            onValue(ref(database, `typing/global`), (snap) => {
                const typers = snap.val() || {};
                const activeTypers = Object.keys(typers).filter(u => u !== currentUser && typers[u]);
                const sub = document.getElementById('globalTypingSub');
                if (sub) {
                    if (activeTypers.length > 0) {
                        sub.innerText = `✍️ ${activeTypers.join(', ')} печатает...`;
                        sub.style.color = '#ffd700';
                    } else {
                        sub.innerText = 'Все жители Идиаканта';
                        sub.style.color = 'inherit';
                    }
                }
                if (activeChatId === 'global') {
                    toggleInMessageTyping(activeTypers.join(', '), activeTypers.length > 0);
                }
            });
        }

        function toggleInMessageTyping(authorName, isTyping) {
            const typingRow = document.getElementById('typingIndicatorRow');
            const typingAvatar = document.getElementById('typingAvatar');
            const typingText = document.getElementById('typingText');

            if (isTyping) {
                const userAvatar = allUsersData[authorName] ? allUsersData[authorName].avatar : '✍️';
                renderAvatar(typingAvatar, userAvatar);
                typingText.innerText = `${authorName} печатает...`;
                typingRow.classList.add('active');
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } else {
                typingRow.classList.remove('active');
            }
        }

        function updateHeaderStatus() {
            const statusEl = document.getElementById('activeChatStatus');

            if (activeChatId === 'global') {
                onValue(ref(database, 'status'), (snap) => {
                    const statuses = snap.val() || {};
                    const onlineCount = Object.values(statuses).filter(s => s.state === 'online').length;
                    statusEl.innerText = `🟢 ${onlineCount} в сети (нажми на чат)`;
                    statusEl.style.color = '#2ec4b6';
                }, { onlyOnce: true });
            } else {
                onValue(ref(database, 'status/' + activeChatId), (snap) => {
                    const data = snap.val();
                    if (data && data.state === 'online') {
                        statusEl.innerText = '🟢 онлайн';
                        statusEl.style.color = '#2ec4b6';
                    } else {
                        statusEl.innerText = '⚪ офлайн';
                        statusEl.style.color = 'inherit';
                    }
                }, { onlyOnce: true });
            }
        }

        function openChat(chatId, title, avatar) {
            activeChatId = chatId;
            document.getElementById('activeChatTitle').innerText = title;
            renderAvatar(document.getElementById('activeChatAvatar'), avatar);
            
            chatMessages.innerHTML = '';
            messenger.classList.add('open-chat');
            cancelReply();
            toggleInMessageTyping('', false);

            if (currentChatRef) off(currentChatRef);

            updateHeaderStatus();

            let chatDbPath = 'global_chat';
            if (chatId !== 'global') {
                const pair = [currentUser, chatId].sort().join('_');
                chatDbPath = 'private_chats/' + pair;
            }

            currentChatRef = ref(database, chatDbPath);

            onChildAdded(currentChatRef, (snapshot) => {
                if (!document.getElementById('msg-' + snapshot.key)) {
                    renderSingleMessage(snapshot.val(), snapshot.key);
                }
            });

            onChildChanged(currentChatRef, (snapshot) => {
                const msgEl = document.getElementById('msg-' + snapshot.key);
                if (msgEl) {
                    const data = snapshot.val();
                    const textContainer = msgEl.querySelector('.msg-text');
                    if (textContainer && !data.sticker) {
                        textContainer.innerHTML = `${data.text} <span class="edited-tag">(изм.)</span>`;
                    }
                }
            });

            onChildRemoved(currentChatRef, (snapshot) => {
                const msgEl = document.getElementById('msg-' + snapshot.key);
                if (msgEl) msgEl.remove();
            });
        }

        function renderSingleMessage(data, msgId) {
            const row = document.createElement('div');
            row.className = `message-row ${data.author === currentUser ? 'my-msg' : ''}`;
            row.id = `msg-${msgId}`;

            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'msg-avatar';
            renderAvatar(avatarDiv, data.avatar);

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';

            let replyHTML = '';
            if (data.replyTo) {
                replyHTML = `
                    <div class="reply-preview-bubble reply-preview-clickable" style="cursor: pointer;">
                        <div class="reply-author">${data.replyTo.author}</div>
                        <div>${data.replyTo.text}</div>
                    </div>
                `;
            }

            let mainContent = `<div class="msg-text">${data.text || ''} ${data.isEdited ? '<span class="edited-tag">(изм.)</span>' : ''}</div>`;
            
            if (data.sticker) {
                mainContent = `<img src="${data.sticker}" class="sticker-img">`;
            }

            let gameHTML = '';
            const hasPlayed = playedGames.includes(msgId);

            if (data.text === '🎰') {
                const gameId = 'game-' + msgId;
                gameHTML = `<div class="interactive-box" id="box-${gameId}"><div class="game-display" id="${gameId}">🎰 🎰 🎰</div><div class="game-status" id="${gameId}-status">...</div></div>`;
                mainContent = '';
                const gameResult = data.gameResult || data.casinoResult; 
                setTimeout(() => handleCasinoLogic(gameId, gameResult, msgId, hasPlayed), 100);
            }

            if (data.text === '⚽') {
                const gameId = 'game-' + msgId;
                gameHTML = `<div class="interactive-box" id="box-${gameId}"><div class="game-display" id="${gameId}">🥅 🧤 ⚽</div><div class="game-status" id="${gameId}-status">Удар...</div></div>`;
                mainContent = '';
                setTimeout(() => handleFootballLogic(gameId, data.gameResult, msgId, hasPlayed), 100);
            }

            bubble.innerHTML = `
                <div class="msg-author">${data.author}</div>
                ${replyHTML}
                ${mainContent}
                ${gameHTML}
                <div class="msg-time">${data.time}</div>
            `;

            row.appendChild(avatarDiv);
            row.appendChild(bubble);

            const replyPreview = bubble.querySelector('.reply-preview-clickable');
            if (replyPreview && data.replyTo && data.replyTo.msgId) {
                replyPreview.addEventListener('click', (e) => {
                    e.stopPropagation();
                    scrollToMessage(data.replyTo.msgId);
                });
            }

            attachLongPressMenu(row, { ...data, msgId: msgId });
            attachSwipeToReply(row, { ...data, msgId: msgId });

            chatMessages.appendChild(row);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // --- ЛОГИКА СТИКЕРОВ ---
        const stickersPanel = document.getElementById('stickersPanel');
        const stickersGrid = document.getElementById('stickersGrid');
        const packCreateArea = document.getElementById('packCreateArea');
        let currentStickerTab = 'general';

        document.getElementById('toggleStickersBtn').addEventListener('click', () => {
            stickersPanel.classList.toggle('active');
        });

        document.getElementById('tabGeneralStickers').addEventListener('click', (e) => {
            document.querySelectorAll('.sticker-tab-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            packCreateArea.style.display = 'none';
            currentStickerTab = 'general';
            loadStickers('general');
        });

        document.getElementById('tabMyPackStickers').addEventListener('click', (e) => {
            document.querySelectorAll('.sticker-tab-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            packCreateArea.style.display = 'flex';
            currentStickerTab = 'my';
            loadStickers('my');
        });

        // Загрузка файла стикера (переработка картинки в текст)
        document.getElementById('stickerFileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            const packName = document.getElementById('packNameInput').value.trim() || 'Мой пак';

            if (file) {
                const stickerText = await convertFileToBase64(file, 200, 200);
                push(ref(database, `sticker_packs/${currentUser}/${packName}`), stickerText);
                loadStickers('my');
            }
        });

        function loadStickers(type) {
            stickersGrid.innerHTML = '';

            if (type === 'general') {
                // Общие встроенные стикеры
                onValue(ref(database, 'sticker_packs/general'), (snap) => {
                    const data = snap.val() || {};
                    stickersGrid.innerHTML = '';
                    Object.values(data).forEach(url => {
                        const img = document.createElement('img');
                        img.className = 'sticker-item';
                        img.src = url;
                        img.addEventListener('click', () => sendSticker(url));
                        stickersGrid.appendChild(img);
                    });
                });
            } else {
                // Пользовательские стикеры
                onValue(ref(database, `sticker_packs/${currentUser}`), (snap) => {
                    const packs = snap.val() || {};
                    stickersGrid.innerHTML = '';
                    Object.keys(packs).forEach(packName => {
                        const items = packs[packName];
                        Object.values(items).forEach(url => {
                            const img = document.createElement('img');
                            img.className = 'sticker-item';
                            img.src = url;
                            img.addEventListener('click', () => sendSticker(url));
                            stickersGrid.appendChild(img);
                        });
                    });
                });
            }
        }

        function sendSticker(stickerBase64) {
            sendDirectMessage('', stickerBase64);
            stickersPanel.classList.remove('active');
        }

        // МОДАЛКА КТО В СЕТИ
        const onlineModalOverlay = document.getElementById('onlineModalOverlay');
        const onlineModalList = document.getElementById('onlineModalList');

        document.getElementById('chatWindowHeader').addEventListener('click', (e) => {
            if (e.target.classList.contains('back-btn')) return;

            onlineModalList.innerHTML = '';
            onValue(ref(database, 'status'), (snap) => {
                const statuses = snap.val() || {};
                let count = 0;

                Object.keys(statuses).forEach(user => {
                    if (statuses[user].state === 'online') {
                        count++;
                        const userAvatar = allUsersData[user] ? allUsersData[user].avatar : '🐱';

                        const item = document.createElement('div');
                        item.style.cssText = "display:flex; align-items:center; gap:10px; padding:6px; border-bottom:1px solid var(--border-color);";
                        
                        const avContainer = document.createElement('div');
                        avContainer.className = "msg-avatar";
                        renderAvatar(avContainer, userAvatar);

                        const nameEl = document.createElement('div');
                        nameEl.style.fontWeight = 'bold';
                        nameEl.innerText = user + (user === currentUser ? ' (Вы)' : '');

                        item.appendChild(avContainer);
                        item.appendChild(nameEl);
                        onlineModalList.appendChild(item);
                    }
                });

                if (count === 0) {
                    onlineModalList.innerText = 'Никого нет в сети';
                }
                onlineModalOverlay.classList.add('active');
            }, { onlyOnce: true });
        });

        document.getElementById('closeOnlineModalBtn').addEventListener('click', () => {
            onlineModalOverlay.classList.remove('active');
        });

        function attachLongPressMenu(element, msgData) {
            let pressTimer = null;

            const startPress = (e) => {
                if (e.button && e.button !== 0) return;
                pressTimer = setTimeout(() => {
                    openContextMenu(element, msgData);
                }, 500);
            };

            const cancelPress = () => {
                clearTimeout(pressTimer);
            };

            element.addEventListener('touchstart', startPress, { passive: true });
            element.addEventListener('touchend', cancelPress);
            element.addEventListener('touchmove', cancelPress);

            element.addEventListener('mousedown', startPress);
            element.addEventListener('mouseup', cancelPress);
            element.addEventListener('mouseleave', cancelPress);

            element.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                openContextMenu(element, msgData);
            });
        }

        function openContextMenu(element, msgData) {
            document.querySelectorAll('.message-row').forEach(el => el.classList.remove('msg-selected'));
            element.classList.add('msg-selected');

            selectedMsgData = msgData;

            document.getElementById('replyBarAuthor').innerText = msgData.author;
            document.getElementById('replyBarText').innerText = msgData.sticker ? '🖼️ Стикер' : (msgData.text || 'Игра');

            repeatGameBtn.style.display = (msgData.text === '🎰' || msgData.text === '⚽') ? 'block' : 'none';
            editMsgBtn.style.display = (msgData.author === currentUser && msgData.text !== '🎰' && msgData.text !== '⚽' && !msgData.sticker) ? 'block' : 'none';
            deleteMsgBtn.style.display = (msgData.author === currentUser) ? 'block' : 'none';

            replyBar.classList.add('active');
        }

        deleteMsgBtn.addEventListener('click', () => {
            if (selectedMsgData && selectedMsgData.msgId) {
                let chatDbPath = 'global_chat';
                if (activeChatId !== 'global') {
                    const pair = [currentUser, activeChatId].sort().join('_');
                    chatDbPath = 'private_chats/' + pair;
                }
                remove(ref(database, `${chatDbPath}/${selectedMsgData.msgId}`));
                cancelReply();
            }
        });

        editMsgBtn.addEventListener('click', () => {
            if (selectedMsgData && selectedMsgData.msgId) {
                editingMsgId = selectedMsgData.msgId;
                userInput.value = selectedMsgData.text;
                userInput.focus();
                document.getElementById('sendBtn').innerText = '✓';
            }
        });

        function scrollToMessage(targetMsgId) {
            const targetEl = document.getElementById(`msg-${targetMsgId}`);
            if (targetEl) {
                targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                targetEl.classList.remove('highlight-msg');
                void targetEl.offsetWidth;
                targetEl.classList.add('highlight-msg');
                setTimeout(() => targetEl.classList.remove('highlight-msg'), 2000);
            }
        }

        function handleCasinoLogic(id, finalResult, msgId, hasPlayed) {
            const reelsEl = document.getElementById(id);
            const statusEl = document.getElementById(id + '-status');
            if (!reelsEl) return;
            const symbols = ['🍋', '🍒', '7️⃣', '🍇'];

            if (!finalResult) {
                finalResult = [symbols[Math.floor(Math.random() * 4)], symbols[Math.floor(Math.random() * 4)], symbols[Math.floor(Math.random() * 4)]];
            }

            const updateStatus = (res) => {
                if (res[0] === '7️⃣' && res[1] === '7️⃣' && res[2] === '7️⃣') statusEl.innerText = "💥 ДЖЕКПОТ! 777 💥";
                else if (res[0] === res[1] && res[1] === res[2]) statusEl.innerText = "🎉 ВЫИГРЫШ!";
                else statusEl.innerText = "❌ Не повезло!";
            };

            if (hasPlayed) {
                reelsEl.innerText = `${finalResult[0]} ${finalResult[1]} ${finalResult[2]}`;
                updateStatus(finalResult);
                return;
            }

            statusEl.innerText = "Крутим...";
            let ticks = 0;
            const interval = setInterval(() => {
                reelsEl.innerText = `${symbols[Math.floor(Math.random()*4)]} ${symbols[Math.floor(Math.random()*4)]} ${symbols[Math.floor(Math.random()*4)]}`;
                ticks++;
                if (ticks > 15) {
                    clearInterval(interval);
                    reelsEl.innerText = `${finalResult[0]} ${finalResult[1]} ${finalResult[2]}`;
                    updateStatus(finalResult);
                    savePlayedGame(msgId);
                }
            }, 80);
        }

        function handleFootballLogic(id, finalResult, msgId, hasPlayed) {
            const displayEl = document.getElementById(id);
            const statusEl = document.getElementById(id + '-status');
            if (!displayEl) return;

            if (!finalResult) finalResult = { isGoal: Math.random() > 0.5 };

            const updateStatus = (isGoal) => statusEl.innerText = isGoal ? "🎯 ГОЛ!!!" : "❌ СЕЙВ ВРАТАРЯ!";

            if (hasPlayed) {
                displayEl.innerText = finalResult.isGoal ? "🥅 ⚽ 🧤" : "🥅 🧤⚽";
                updateStatus(finalResult.isGoal);
                return;
            }

            statusEl.innerText = "Удар...";
            let frames = ["🥅 ⚽  🧤", "🥅  ⚽ 🧤", "🥅   ⚽🧤"];
            let step = 0;
            const interval = setInterval(() => {
                displayEl.innerText = frames[step % frames.length];
                step++;
                if (step > 10) {
                    clearInterval(interval);
                    displayEl.innerText = finalResult.isGoal ? "🥅 ⚽ 🧤" : "🥅 🧤⚽";
                    updateStatus(finalResult.isGoal);
                    savePlayedGame(msgId);
                }
            }, 120);
        }

        function savePlayedGame(msgId) {
            playedGames.push(msgId);
            localStorage.setItem('idi_played_games', JSON.stringify(playedGames));
        }

        repeatGameBtn.addEventListener('click', () => {
            if (selectedMsgData && (selectedMsgData.text === '🎰' || selectedMsgData.text === '⚽')) {
                sendDirectMessage(selectedMsgData.text);
                cancelReply();
            }
        });

        function attachSwipeToReply(rowElement, msgData) {
            let startX = 0, currentX = 0, isSwiping = false;

            const startSwipe = (x) => { startX = x; isSwiping = true; };
            const moveSwipe = (x) => {
                if (!isSwiping) return;
                const diffX = x - startX;
                if (diffX < 0 && diffX > -100) {
                    currentX = diffX;
                    rowElement.style.transform = `translateX(${currentX}px)`;
                }
            };
            const endSwipe = () => {
                if (!isSwiping) return;
                isSwiping = false;
                rowElement.style.transform = `translateX(0px)`;
                if (currentX < -50) openContextMenu(rowElement, msgData);
                currentX = 0;
            };

            rowElement.addEventListener('touchstart', (e) => startSwipe(e.touches[0].clientX), { passive: true });
            rowElement.addEventListener('touchmove', (e) => moveSwipe(e.touches[0].clientX), { passive: true });
            rowElement.addEventListener('touchend', endSwipe);
        }

        function cancelReply() {
            selectedMsgData = null;
            editingMsgId = null;
            repeatGameBtn.style.display = 'none';
            editMsgBtn.style.display = 'none';
            deleteMsgBtn.style.display = 'none';
            replyBar.classList.remove('active');
            document.querySelectorAll('.message-row').forEach(el => el.classList.remove('msg-selected'));
            document.getElementById('sendBtn').innerText = '➤';
        }

        document.getElementById('cancelReplyBtn').addEventListener('click', cancelReply);

        function sendDirectMessage(text, stickerData = null) {
            if ((!text && !stickerData) || !currentUser) return;

            let chatDbPath = 'global_chat';
            if (activeChatId !== 'global') {
                const pair = [currentUser, activeChatId].sort().join('_');
                chatDbPath = 'private_chats/' + pair;
            }

            if (editingMsgId) {
                update(ref(database, `${chatDbPath}/${editingMsgId}`), {
                    text: text,
                    isEdited: true
                });
                cancelReply();
                return;
            }

            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const msgObject = {
                author: currentUser,
                avatar: currentAvatar,
                text: text,
                time: time
            };

            if (stickerData) {
                msgObject.sticker = stickerData;
            }

            if (text === '🎰') {
                const symbols = ['🍋', '🍒', '7️⃣', '🍇'];
                msgObject.gameResult = [symbols[Math.floor(Math.random() * 4)], symbols[Math.floor(Math.random() * 4)], symbols[Math.floor(Math.random() * 4)]];
            } else if (text === '⚽') {
                msgObject.gameResult = { isGoal: Math.random() > 0.5 };
            }

            if (selectedMsgData) {
                msgObject.replyTo = {
                    author: selectedMsgData.author,
                    text: selectedMsgData.sticker ? '🖼️ Стикер' : (selectedMsgData.text || 'Игра'),
                    msgId: selectedMsgData.msgId || null
                };
            }

            push(ref(database, chatDbPath), msgObject);
            set(ref(database, `typing/${activeChatId}/${currentUser}`), false);
        }

        document.getElementById('chatForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (text) {
                sendDirectMessage(text);
                userInput.value = '';
                cancelReply();
            }
        });

        document.getElementById('globalChatItem').addEventListener('click', () => {
            document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
            document.getElementById('globalChatItem').classList.add('active');
            openChat('global', 'Общий чат страны', '📢');
        });

        document.getElementById('backBtn').addEventListener('click', () => messenger.classList.remove('open-chat'));

        const drawer = document.getElementById('sidebarDrawer');
        const overlay = document.getElementById('drawerOverlay');

        document.getElementById('openMenuBtn').addEventListener('click', () => {
            drawer.classList.add('active');
            overlay.classList.add('active');
            document.getElementById('setAvatarInput').value = currentAvatar;
        });

        overlay.addEventListener('click', () => {
            drawer.classList.remove('active');
            overlay.classList.remove('active');
        });

        document.getElementById('saveAvatarBtn').addEventListener('click', async () => {
            currentAvatar = document.getElementById('setAvatarInput').value.trim() || '🐱';
            localStorage.setItem('idi_avatar', currentAvatar);
            await set(ref(database, 'users/' + currentUser), { avatar: currentAvatar });
            renderAvatar(document.getElementById('drawerAvatar'), currentAvatar);
            drawer.classList.remove('active');
            overlay.classList.remove('active');
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            if (currentUser) {
                await set(ref(database, 'status/' + currentUser), { state: 'offline', last_changed: Date.now() });
            }
            localStorage.clear();
            location.reload();
        });

        if (currentUser) initApp();
    </script>
</body>
</html>
