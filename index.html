<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат страны Мир Идиаканта</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #d1a374;
            background-image: radial-gradient(#e5c29f 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 85vh;
            background-color: #fff8f0;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(60, 40, 20, 0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid #b8860b;
        }

        .chat-header {
            background: linear-gradient(135deg, #2c1d11, #573a23);
            color: #f3e5ab;
            padding: 15px 20px;
            border-bottom: 2px solid #b8860b;
        }

        .chat-header h2 {
            font-size: 1.2rem;
            margin-bottom: 3px;
        }

        .chat-header p {
            font-size: 0.8rem;
            color: #d1a374;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #fdfaf6;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
            background-color: #eae0d5;
            color: #332211;
            align-self: flex-start;
        }

        .message-author {
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 3px;
            color: #8b5a2b;
        }

        .message-time {
            font-size: 0.65rem;
            opacity: 0.7;
            text-align: right;
            margin-top: 4px;
        }

        .chat-input-area {
            display: flex;
            padding: 15px;
            background-color: #fff8f0;
            border-top: 1px solid #e5c29f;
            gap: 10px;
        }

        .chat-input-area input {
            padding: 10px;
            border: 1px solid #c8a27c;
            border-radius: 8px;
            outline: none;
        }

        .chat-input-area input[type="text"] {
            flex: 1;
        }

        #usernameInput {
            width: 110px;
            font-weight: bold;
        }

        .chat-input-area button {
            background-color: #573a23;
            color: #f3e5ab;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .chat-input-area button:hover {
            background-color: #3c2818;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h2>🐾 Чат «Мир Идиаканта»</h2>
            <p>Онлайн-связь жителей страны</p>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <form class="chat-input-area" id="chatForm">
            <input type="text" id="usernameInput" placeholder="Имя..." value="Житель" required>
            <input type="text" id="userInput" placeholder="Напишите сообщение..." autocomplete="off" required>
            <button type="submit">Отправить</button>
        </form>
    </div>

    <!-- Модули Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Ваша конфигурация
        const firebaseConfig = {
            apiKey: "AIzaSyByKktnwPbg1zBU4wYR8hceDc57BR0Y4Zo",
            authDomain: "worldidiakant.firebaseapp.com",
            databaseURL: "https://worldidiakant-default-rtdb.firebaseio.com",
            projectId: "worldidiakant",
            storageBucket: "worldidiakant.firebasestorage.app",
            messagingSenderId: "118297973184",
            appId: "1:118297973184:web:3bbf230075f71f6b66b825",
            measurementId: "G-FPZMTSWPDQ"
        };

        // Инициализация Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const messagesRef = ref(database, 'messages');

        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const usernameInput = document.getElementById('usernameInput');

        // Отправка сообщения в Firebase
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            const author = usernameInput.value.trim() || 'Аноним';

            if (text) {
                const now = new Date();
                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                push(messagesRef, {
                    author: author,
                    text: text,
                    time: timeStr
                });

                userInput.value = '';
            }
        });

        // Получение сообщений из Firebase в режиме реального времени
        onChildAdded(messagesRef, (snapshot) => {
            const data = snapshot.val();
            
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');
            messageDiv.innerHTML = `
                <div class="message-author">${data.author}</div>
                <div>${data.text}</div>
                <div class="message-time">${data.time}</div>
            `;

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });
    </script>
</body>
</html>
