<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат страны Мир Идиаканта</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #d1a374;
            background-image: radial-gradient(#e5c29f 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 85vh;
            background-color: #fff8f0;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(60, 40, 20, 0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid #b8860b;
            position: relative;
        }

        .chat-header {
            background: linear-gradient(135deg, #2c1d11, #573a23);
            color: #f3e5ab;
            padding: 15px 20px;
            border-bottom: 2px solid #b8860b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 1.1rem;
        }

        .logout-btn {
            background: #8b5a2b;
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .auth-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #fff8f0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            gap: 15px;
        }

        .auth-screen h2 {
            color: #573a23;
            margin-bottom: 10px;
            text-align: center;
        }

        .auth-input {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            border: 1px solid #c8a27c;
            border-radius: 8px;
            outline: none;
        }

        .auth-btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 300px;
        }

        .auth-btn {
            flex: 1;
            padding: 12px;
            background-color: #573a23;
            color: #f3e5ab;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .auth-error {
            color: #b30000;
            font-size: 0.85rem;
            min-height: 20px;
            text-align: center;
            max-width: 300px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #fdfaf6;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
            background-color: #eae0d5;
            color: #332211;
            align-self: flex-start;
        }

        .message.my-message {
            background-color: #573a23;
            color: #ffffff;
            align-self: flex-end;
        }

        .message-author {
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 3px;
            color: #8b5a2b;
        }

        .message.my-message .message-author {
            color: #f3e5ab;
        }

        .message-time {
            font-size: 0.65rem;
            opacity: 0.7;
            text-align: right;
            margin-top: 4px;
        }

        .chat-input-area {
            display: flex;
            padding: 15px;
            background-color: #fff8f0;
            border-top: 1px solid #e5c29f;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #c8a27c;
            border-radius: 8px;
            outline: none;
        }

        .chat-input-area button {
            background-color: #573a23;
            color: #f3e5ab;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Экран входа -->
        <div class="auth-screen" id="authScreen">
            <h2>🐾 Мир Идиаканта</h2>
            <input type="text" id="authUsername" class="auth-input" placeholder="Ваш Никнейм" autocomplete="off">
            <input type="password" id="authPassword" class="auth-input" placeholder="Пароль">
            <div class="auth-error" id="authError"></div>
            <div class="auth-btn-group">
                <button class="auth-btn" id="loginBtn">Войти</button>
                <button class="auth-btn" id="regBtn" style="background-color: #8b5a2b;">Создать аккаунт</button>
            </div>
        </div>

        <!-- Шапка -->
        <div class="chat-header">
            <h2 id="headerTitle">🐾 Чат Идиаканта</h2>
            <button class="logout-btn" id="logoutBtn">Выйти</button>
        </div>

        <!-- Окно с сообщениями -->
        <div class="chat-messages" id="chatMessages"></div>

        <!-- Поле отправки -->
        <form class="chat-input-area" id="chatForm">
            <input type="text" id="userInput" placeholder="Напишите сообщение..." autocomplete="off" required>
            <button type="submit">Отправить</button>
        </form>
    </div>

    <!-- Модули Firebase (Стабильная версия) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, onChildAdded, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Конфигурация вашего проекта
        const firebaseConfig = {
            apiKey: "AIzaSyByKktnwPbg1zBU4wYR8hceDc57BR0Y4Zo",
            authDomain: "worldidiakant.firebaseapp.com",
            databaseURL: "https://worldidiakant-default-rtdb.firebaseio.com",
            projectId: "worldidiakant",
            storageBucket: "worldidiakant.firebasestorage.app",
            messagingSenderId: "118297973184",
            appId: "1:118297973184:web:3bbf230075f71f6b66b825",
            measurementId: "G-FPZMTSWPDQ"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const messagesRef = ref(database, 'global_chat');
        const usersRef = ref(database, 'users');

        const authScreen = document.getElementById('authScreen');
        const authUsername = document.getElementById('authUsername');
        const authPassword = document.getElementById('authPassword');
        const authError = document.getElementById('authError');
        const loginBtn = document.getElementById('loginBtn');
        const regBtn = document.getElementById('regBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const headerTitle = document.getElementById('headerTitle');
        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');

        let currentUser = localStorage.getItem('idiakant_user');

        // Очистка ника от недопустимых символов
        function cleanName(str) {
            return str.replace(/[.$\[\]#\/]/g, "_").trim();
        }

        // Если пользователь уже входил ранее
        if (currentUser) {
            authScreen.style.display = 'none';
            headerTitle.innerText = `🐾 Чат: ${currentUser}`;
            startListening();
        }

        // Регистрация
        regBtn.addEventListener('click', async () => {
            const nick = cleanName(authUsername.value);
            const pass = authPassword.value.trim();

            if (!nick || !pass) {
                authError.innerText = "Заполните логин и пароль!";
                return;
            }

            try {
                const snapshot = await get(child(usersRef, nick));
                if (snapshot.exists()) {
                    authError.innerText = "Этот ник уже занят!";
                } else {
                    await set(ref(database, 'users/' + nick), { pass: pass });
                    completeLogin(nick);
                }
            } catch (err) {
                authError.innerText = "Ошибка! Проверьте правила (Rules) в Firebase.";
                console.error(err);
            }
        });

        // Вход
        loginBtn.addEventListener('click', async () => {
            const nick = cleanName(authUsername.value);
            const pass = authPassword.value.trim();

            if (!nick || !pass) {
                authError.innerText = "Заполните логин и пароль!";
                return;
            }

            try {
                const snapshot = await get(child(usersRef, nick));
                if (snapshot.exists()) {
                    if (snapshot.val().pass === pass) {
                        completeLogin(nick);
                    } else {
                        authError.innerText = "Неверный пароль!";
                    }
                } else {
                    authError.innerText = "Пользователь не найден!";
                }
            } catch (err) {
                authError.innerText = "Ошибка подключения к базе!";
                console.error(err);
            }
        });

        function completeLogin(nick) {
            currentUser = nick;
            localStorage.setItem('idiakant_user', nick);
            authScreen.style.display = 'none';
            headerTitle.innerText = `🐾 Чат: ${nick}`;
            authError.innerText = '';
            startListening();
        }

        // Выход
        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('idiakant_user');
            location.reload();
        });

        // Отправка сообщений всем
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();

            if (text && currentUser) {
                const now = new Date();
                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                try {
                    await push(messagesRef, {
                        author: currentUser,
                        text: text,
                        time: timeStr
                    });
                    userInput.value = '';
                } catch (e) {
                    alert("Ошибка отправки! Опубликованы ли правила (Rules) в Firebase?");
                }
            }
        });

        // Приём сообщений в реальном времени
        let isListening = false;
        function startListening() {
            if (isListening) return;
            isListening = true;

            onChildAdded(messagesRef, (snapshot) => {
                const data = snapshot.val();
                
                const msgDiv = document.createElement('div');
                msgDiv.classList.add('message');

                if (data.author === currentUser) {
                    msgDiv.classList.add('my-message');
                }

                msgDiv.innerHTML = `
                    <div class="message-author">${data.author}</div>
                    <div>${data.text}</div>
                    <div class="message-time">${data.time}</div>
                `;

                chatMessages.appendChild(msgDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });
        }
    </script>
</body>

<body>

    <div class="chat-container">
        <div class="status-bar" id="statusBar">● Подключение к серверу...</div>

        <!-- Окно Входа/Регистрации -->
        <div class="overlay-screen" id="authScreen">
            <h2>🐾 Мир Идиаканта</h2>
            <input type="text" id="authUsername" class="auth-input" placeholder="Логин / Никнейм">
            <input type="password" id="authPassword" class="auth-input" placeholder="Пароль">
            <input type="text" id="authAvatar" class="auth-input" placeholder="Ссылка на фото или Эмодзи (например 😎)">
            <button class="auth-btn" id="startBtn">Войти в Чат</button>
        </div>

        <!-- Окно Настроек -->
        <div class="overlay-screen" id="settingsScreen" style="display: none;">
            <h2>⚙️ Настройки Профиля</h2>
            <input type="text" id="setAvatar" class="auth-input" placeholder="URL фото или Эмодзи">
            <button class="auth-btn" id="saveSettingsBtn">Сохранить</button>
            <button class="auth-btn" id="closeSettingsBtn" style="background:#8b5a2b;">Отмена</button>
        </div>

        <!-- Шапка -->
        <div class="chat-header">
            <div class="chat-header-info">
                <div class="header-avatar" id="headerAvatar">🐱</div>
                <div>
                    <h2 id="headerTitle" style="font-size: 1rem;">Идиакант</h2>
                </div>
            </div>
            <div class="header-btns">
                <button class="icon-btn" id="openSettingsBtn">⚙️</button>
                <button class="icon-btn" id="logoutBtn">🚪</button>
            </div>
        </div>

        <!-- Сообщения -->
        <div class="chat-messages" id="chatMessages"></div>

        <!-- Форма -->
        <form class="chat-input-area" id="chatForm">
            <input type="text" id="userInput" placeholder="Напишите сообщение..." autocomplete="off" required>
            <button type="submit">➤</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyByKktnwPbg1zBU4wYR8hceDc57BR0Y4Zo",
            authDomain: "worldidiakant.firebaseapp.com",
            databaseURL: "https://worldidiakant-default-rtdb.firebaseio.com",
            projectId: "worldidiakant",
            storageBucket: "worldidiakant.firebasestorage.app",
            messagingSenderId: "118297973184",
            appId: "1:118297973184:web:3bbf230075f71f6b66b825",
            measurementId: "G-FPZMTSWPDQ"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const messagesRef = ref(database, 'chat_v2');

        // Отслеживание статуса соединения
        const connectedRef = ref(database, ".info/connected");
        onValue(connectedRef, (snap) => {
            if (snap.val() === true) {
                document.getElementById('statusBar').innerText = "● В сети (Мир Идиаканта)";
                document.getElementById('statusBar').style.color = "#00ff66";
            } else {
                document.getElementById('statusBar').innerText = "○ Нет подключения к Firebase";
                document.getElementById('statusBar').style.color = "#ff4444";
            }
        });

        // Переменные пользователя
        let currentUser = localStorage.getItem('idi_user') || '';
        let currentAvatar = localStorage.getItem('idi_avatar') || '🐱';

        function updateUI() {
            if (currentUser) {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('headerTitle').innerText = currentUser;
                renderAvatar(document.getElementById('headerAvatar'), currentAvatar);
            }
        }

        function renderAvatar(element, avatarData) {
            if (avatarData.startsWith('http://') || avatarData.startsWith('https://')) {
                element.innerHTML = `<img src="${avatarData}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
            } else {
                element.innerText = avatarData || '🐱';
            }
        }

        // Авторизация
        document.getElementById('startBtn').addEventListener('click', () => {
            const user = document.getElementById('authUsername').value.trim();
            const avatar = document.getElementById('authAvatar').value.trim() || '🐱';

            if (user) {
                currentUser = user;
                currentAvatar = avatar;
                localStorage.setItem('idi_user', user);
                localStorage.setItem('idi_avatar', avatar);
                updateUI();
                listenMessages();
            } else {
                alert("Введите имя!");
            }
        });

        // Настройки
        document.getElementById('openSettingsBtn').addEventListener('click', () => {
            document.getElementById('settingsScreen').style.display = 'flex';
            document.getElementById('setAvatar').value = currentAvatar;
        });

        document.getElementById('closeSettingsBtn').addEventListener('click', () => {
            document.getElementById('settingsScreen').style.display = 'none';
        });

        document.getElementById('saveSettingsBtn').addEventListener('click', () => {
            currentAvatar = document.getElementById('setAvatar').value.trim() || '🐱';
            localStorage.setItem('idi_avatar', currentAvatar);
            document.getElementById('settingsScreen').style.display = 'none';
            updateUI();
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.clear();
            location.reload();
        });

        // Отправка сообщений
        document.getElementById('chatForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('userInput');
            const text = input.value.trim();

            if (text && currentUser) {
                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                push(messagesRef, {
                    author: currentUser,
                    avatar: currentAvatar,
                    text: text,
                    time: time
                }).then(() => {
                    input.value = '';
                }).catch((err) => {
                    alert("Ошибка отправки! Проверьте правила базы в консоли.");
                });
            }
        });

        // Слушатель чата
        let isListening = false;
        function listenMessages() {
            if (isListening) return;
            isListening = true;

            onChildAdded(messagesRef, (snapshot) => {
                const data = snapshot.val();
                
                const row = document.createElement('div');
                row.className = `message-row ${data.author === currentUser ? 'my-msg-row' : ''}`;

                const avatarDiv = document.createElement('div');
                avatarDiv.className = 'msg-avatar';
                renderAvatar(avatarDiv, data.avatar);

                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                bubble.innerHTML = `
                    <div class="msg-author">${data.author}</div>
                    <div>${data.text}</div>
                    <div class="msg-time">${data.time}</div>
                `;

                row.appendChild(avatarDiv);
                row.appendChild(bubble);

                const container = document.getElementById('chatMessages');
                container.appendChild(row);
                container.scrollTop = container.scrollHeight;
            });
        }

        updateUI();
        if (currentUser) listenMessages();
    </script>
</body>
</html>
