<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мессенджер «Мир Идиаканта»</title>
    <style>
        :root {
            --bg-body: #2c1d11;
            --bg-container: #fff8f0;
            --bg-chats-list: #eae0d5;
            --bg-chat-active: #d1a374;
            --bg-window: #fdfaf6;
            --bg-header: linear-gradient(135deg, #2c1d11, #573a23);
            --bg-msg-other: #eae0d5;
            --bg-msg-my: #573a23;
            --text-main: #332211;
            --text-my: #ffffff;
            --text-header: #f3e5ab;
            --border-color: #b8860b;
            --font-size-msg: 0.9rem;
        }

        body.theme-dark {
            --bg-body: #121212;
            --bg-container: #1e1e1e;
            --bg-chats-list: #252525;
            --bg-chat-active: #383838;
            --bg-window: #181818;
            --bg-header: linear-gradient(135deg, #2a2a2a, #1f1f1f);
            --bg-msg-other: #2d2d2d;
            --bg-msg-my: #4a3b52;
            --text-main: #e0e0e0;
            --text-my: #ffffff;
            --text-header: #bb86fc;
            --border-color: #333333;
        }

        body.theme-light {
            --bg-body: #e0e6ed;
            --bg-container: #ffffff;
            --bg-chats-list: #f0f4f8;
            --bg-chat-active: #d9e2ec;
            --bg-window: #ffffff;
            --bg-header: linear-gradient(135deg, #334e68, #243b53);
            --bg-msg-other: #f0f4f8;
            --bg-msg-my: #334e68;
            --text-main: #102a43;
            --text-my: #ffffff;
            --text-header: #f0f4f8;
            --border-color: #bccadc;
        }

        body.theme-neon {
            --bg-body: #050515;
            --bg-container: #0a0a23;
            --bg-chats-list: #101035;
            --bg-chat-active: #1a1a4a;
            --bg-window: #070719;
            --bg-header: linear-gradient(135deg, #12002b, #28004d);
            --bg-msg-other: #16163d;
            --bg-msg-my: #0088cc;
            --text-main: #00ffcc;
            --text-my: #ffffff;
            --text-header: #ff007f;
            --border-color: #ff007f;
        }

        body.font-small { --font-size-msg: 0.8rem; }
        body.font-medium { --font-size-msg: 0.95rem; }
        body.font-large { --font-size-msg: 1.1rem; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .messenger-container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background-color: var(--bg-container);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            overflow: hidden;
            border: 2px solid var(--border-color);
            position: relative;
        }

        /* --- НАСТРОЙКИ --- */
        .sidebar-drawer {
            position: absolute;
            top: 0; left: -300px;
            width: 300px;
            height: 100%;
            background-color: var(--bg-container);
            color: var(--text-main);
            z-index: 30;
            border-right: 2px solid var(--border-color);
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 12px;
            overflow-y: auto;
        }

        .sidebar-drawer.active { left: 0; }

        .drawer-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 29;
            display: none;
        }

        .drawer-overlay.active { display: block; }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .setting-select {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-window);
            color: var(--text-main);
            outline: none;
        }

        /* --- СПИСОК ЧАТОВ --- */
        .chats-list-panel {
            width: 320px;
            background-color: var(--bg-chats-list);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .chats-header {
            background: var(--bg-header);
            color: var(--text-header);
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-header);
            font-size: 1.3rem;
            cursor: pointer;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
        }

        .chat-item:hover, .chat-item.active {
            background-color: var(--bg-chat-active);
        }

        .chat-item-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--bg-msg-my);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
            overflow: hidden;
        }

        .chat-item-info { flex: 1; overflow: hidden; }
        .chat-item-title { font-weight: bold; color: var(--text-main); font-size: 0.95rem; }
        .chat-item-sub { font-size: 0.8rem; opacity: 0.7; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- ОКНО ЧАТА --- */
        .chat-window {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-window);
        }

        .chat-window-header {
            background: var(--bg-header);
            color: var(--text-header);
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--border-color);
        }

        .back-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-header);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-x: hidden;
        }

        /* --- СООБЩЕНИЯ И СВАЙП --- */
        .message-row {
            display: flex;
            gap: 8px;
            max-width: 85%;
            position: relative;
            touch-action: pan-y;
            transition: transform 0.1s ease-out;
            cursor: grab;
        }

        .message-row.my-msg {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg-chat-active);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .msg-bubble {
            background-color: var(--bg-msg-other);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: var(--font-size-msg);
            word-break: break-word;
            position: relative;
        }

        .my-msg .msg-bubble {
            background-color: var(--bg-msg-my);
            color: var(--text-my);
        }

        .msg-author { font-size: 0.75rem; font-weight: bold; opacity: 0.8; margin-bottom: 2px; }
        .msg-time { font-size: 0.65rem; opacity: 0.7; text-align: right; margin-top: 3px; }

        .reply-preview-bubble {
            background: rgba(0,0,0,0.15);
            border-left: 3px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 5px;
            font-size: 0.8rem;
        }
        .reply-author { font-weight: bold; font-size: 0.75rem; }

        /* --- ИНТЕРАКТИВНЫЕ ИГРЫ (КАЗИНО И ФУТБОЛ) --- */
        .interactive-box {
            background: #111;
            color: #fff;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #ffd700;
            text-align: center;
            display: inline-block;
            margin-top: 5px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .interactive-box:active { transform: scale(0.97); }

        .game-display {
            font-size: 1.8rem;
            letter-spacing: 3px;
            background: #222;
            padding: 5px 12px;
            border-radius: 6px;
            border: 1px solid #444;
            min-width: 140px;
        }
        .game-status {
            font-size: 0.75rem;
            color: #ffd700;
            margin-top: 4px;
            font-weight: bold;
        }

        /* ПАНЕЛЬ ОТВЕТА / ПОВТОРА ИГРЫ */
        .reply-bar {
            display: none;
            background: var(--bg-chats-list);
            color: var(--text-main);
            padding: 8px 12px;
            border-top: 1px solid var(--border-color);
            align-items: center;
            justify-content: space-between;
        }
        .reply-bar.active { display: flex; }
        .reply-bar-info { border-left: 3px solid var(--border-color); padding-left: 8px; }
        .close-reply-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-main); }

        .action-fast-btn {
            background: var(--bg-header);
            color: var(--text-header);
            border: none;
            padding: 5px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            background-color: var(--bg-container);
            border-top: 1px solid var(--border-color);
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background: var(--bg-window);
            color: var(--text-main);
            outline: none;
            user-select: text;
        }

        .chat-input-area button {
            background: var(--bg-header);
            color: var(--text-header);
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .auth-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-container);
            color: var(--text-main);
            z-index: 40;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 12px;
        }

        .auth-input {
            width: 100%;
            max-width: 280px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-window);
            color: var(--text-main);
            outline: none;
            user-select: text;
        }

        .auth-btn {
            width: 100%;
            max-width: 280px;
            padding: 10px;
            background: var(--bg-header);
            color: var(--text-header);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            .chats-list-panel { width: 100%; }
            .chat-window { display: none; width: 100%; }
            .messenger-container.open-chat .chats-list-panel { display: none; }
            .messenger-container.open-chat .chat-window { display: flex; }
            .back-btn { display: block; }
        }
    </style>
</head>
<body class="theme-classic font-medium">

    <div class="messenger-container" id="messenger">
        <div class="drawer-overlay" id="drawerOverlay"></div>

        <!-- Боковая панель -->
        <div class="sidebar-drawer" id="sidebarDrawer">
            <h3>⚙️ Настройки</h3>
            
            <div style="text-align: center; margin: 5px 0;">
                <div id="drawerAvatar" class="chat-item-avatar" style="width:65px; height:65px; margin:0 auto; font-size:1.8rem;">🐱</div>
                <h4 id="drawerUsername" style="margin-top:5px;">Имя</h4>
            </div>

            <div class="setting-group">
                <label>Аватар (Ссылка / Эмодзи):</label>
                <input type="text" id="setAvatarInput" class="auth-input" placeholder="например 😎">
                <button class="auth-btn" id="saveAvatarBtn" style="margin-top:5px;">Сохранить фото</button>
            </div>

            <div class="setting-group">
                <label>Тема оформления:</label>
                <select id="themeSelect" class="setting-select">
                    <option value="theme-classic">🪵 Классическая</option>
                    <option value="theme-dark">🌙 Тёмная</option>
                    <option value="theme-light">☀️ Светлая</option>
                    <option value="theme-neon">⚡ Неоновая</option>
                </select>
            </div>

            <div class="setting-group">
                <label>Размер текста:</label>
                <select id="fontSelect" class="setting-select">
                    <option value="font-small">Мелкий</option>
                    <option value="font-medium" selected>Средний</option>
                    <option value="font-large">Крупный</option>
                </select>
            </div>

            <div style="flex:1;"></div>
            <button class="auth-btn" id="logoutBtn" style="opacity: 0.8;">Выйти</button>
        </div>

        <!-- Авторизация -->
        <div class="auth-screen" id="authScreen">
            <h2>🐾 Мир Идиаканта</h2>
            <input type="text" id="authUsername" class="auth-input" placeholder="Логин (Никнейм)">
            <input type="password" id="authPassword" class="auth-input" placeholder="Пароль">
            <input type="text" id="authAvatar" class="auth-input" placeholder="Аватар (Эмодзи или Ссылка)">
            <button class="auth-btn" id="startBtn">Войти в Мессенджер</button>
        </div>

        <!-- Список чатов -->
        <div class="chats-list-panel">
            <div class="chats-header">
                <button class="menu-btn" id="openMenuBtn">☰</button>
                <h3>Идиакант TG</h3>
            </div>
            
            <div id="chatsList" style="overflow-y: auto; flex:1;">
                <div class="chat-item active" id="globalChatItem">
                    <div class="chat-item-avatar">📢</div>
                    <div class="chat-item-info">
                        <div class="chat-item-title">Общий чат страны</div>
                        <div class="chat-item-sub">Все жители Идиаканта</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Окно чата -->
        <div class="chat-window">
            <div class="chat-window-header">
                <button class="back-btn" id="backBtn">◄</button>
                <div class="msg-avatar" id="activeChatAvatar">📢</div>
                <div>
                    <h3 id="activeChatTitle" style="font-size:1rem;">Общий чат страны</h3>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages"></div>

            <!-- Панель ответа / повторной отправки -->
            <div class="reply-bar" id="replyBar">
                <div class="reply-bar-info">
                    <div id="replyBarAuthor" style="font-weight:bold; font-size:0.75rem;">Автор</div>
                    <div id="replyBarText" style="font-size:0.8rem; opacity:0.8;">Текст сообщения</div>
                </div>
                <div style="display:flex; gap:8px; align-items:center;">
                    <button class="action-fast-btn" id="repeatGameBtn" style="display:none;">🎲 Отправить ещё раз</button>
                    <button class="close-reply-btn" id="cancelReplyBtn">✕</button>
                </div>
            </div>

            <form class="chat-input-area" id="chatForm">
                <input type="text" id="userInput" placeholder="Напишите сообщение..." autocomplete="off" required>
                <button type="submit">➤</button>
            </form>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, set, off } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyByKktnwPbg1zBU4wYR8hceDc57BR0Y4Zo",
            authDomain: "worldidiakant.firebaseapp.com",
            databaseURL: "https://worldidiakant-default-rtdb.firebaseio.com",
            projectId: "worldidiakant",
            storageBucket: "worldidiakant.firebasestorage.app",
            messagingSenderId: "118297973184",
            appId: "1:118297973184:web:3bbf230075f71f6b66b825",
            measurementId: "G-FPZMTSWPDQ"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        let currentUser = localStorage.getItem('idi_user') || '';
        let currentAvatar = localStorage.getItem('idi_avatar') || '🐱';
        let activeChatId = 'global';
        let currentChatRef = null;
        let selectedReplyMsg = null;
        let gameToRepeat = null; // Храним эмодзи для повтора (🎰 или ⚽)

        let playedGames = JSON.parse(localStorage.getItem('idi_played_games') || '[]');

        const authScreen = document.getElementById('authScreen');
        const messenger = document.getElementById('messenger');
        const chatMessages = document.getElementById('chatMessages');
        const chatsList = document.getElementById('chatsList');
        const replyBar = document.getElementById('replyBar');
        const repeatGameBtn = document.getElementById('repeatGameBtn');

        // Темы
        const themeSelect = document.getElementById('themeSelect');
        const fontSelect = document.getElementById('fontSelect');
        const savedTheme = localStorage.getItem('idi_theme') || 'theme-classic';
        const savedFont = localStorage.getItem('idi_font') || 'font-medium';

        document.body.className = `${savedTheme} ${savedFont}`;
        themeSelect.value = savedTheme;
        fontSelect.value = savedFont;

        themeSelect.addEventListener('change', (e) => {
            document.body.className = `${e.target.value} ${fontSelect.value}`;
            localStorage.setItem('idi_theme', e.target.value);
        });

        fontSelect.addEventListener('change', (e) => {
            document.body.className = `${themeSelect.value} ${e.target.value}`;
            localStorage.setItem('idi_font', e.target.value);
        });

        function renderAvatar(element, avatarData) {
            if (avatarData && (avatarData.startsWith('http://') || avatarData.startsWith('https://'))) {
                element.innerHTML = `<img src="${avatarData}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
            } else {
                element.innerText = avatarData || '🐱';
            }
        }

        // Авторизация
        document.getElementById('startBtn').addEventListener('click', async () => {
            const user = document.getElementById('authUsername').value.trim();
            const avatar = document.getElementById('authAvatar').value.trim() || '🐱';

            if (user) {
                currentUser = user;
                currentAvatar = avatar;
                localStorage.setItem('idi_user', user);
                localStorage.setItem('idi_avatar', avatar);

                await set(ref(database, 'users/' + user), { avatar: avatar });
                initApp();
            } else {
                alert("Введите никнейм!");
            }
        });

        function initApp() {
            authScreen.style.display = 'none';
            document.getElementById('drawerUsername').innerText = currentUser;
            renderAvatar(document.getElementById('drawerAvatar'), currentAvatar);
            loadUsersList();
            openChat('global', 'Общий чат страны', '📢');
        }

        function loadUsersList() {
            onChildAdded(ref(database, 'users'), (snapshot) => {
                const username = snapshot.key;
                const data = snapshot.val();

                if (username !== currentUser && !document.getElementById('user-chat-' + username)) {
                    const chatItem = document.createElement('div');
                    chatItem.className = 'chat-item';
                    chatItem.id = 'user-chat-' + username;
                    chatItem.innerHTML = `
                        <div class="chat-item-avatar" id="avatar-col-${username}"></div>
                        <div class="chat-item-info">
                            <div class="chat-item-title">${username}</div>
                            <div class="chat-item-sub">Личные сообщения</div>
                        </div>
                    `;

                    chatItem.addEventListener('click', () => {
                        document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
                        chatItem.classList.add('active');
                        openChat(username, username, data.avatar);
                    });

                    chatsList.appendChild(chatItem);
                    renderAvatar(document.getElementById('avatar-col-' + username), data.avatar);
                }
            });
        }

        function openChat(chatId, title, avatar) {
            activeChatId = chatId;
            document.getElementById('activeChatTitle').innerText = title;
            renderAvatar(document.getElementById('activeChatAvatar'), avatar);
            
            chatMessages.innerHTML = '';
            messenger.classList.add('open-chat');
            cancelReply();

            if (currentChatRef) off(currentChatRef);

            let chatDbPath = 'global_chat';
            if (chatId !== 'global') {
                const pair = [currentUser, chatId].sort().join('_');
                chatDbPath = 'private_chats/' + pair;
            }

            currentChatRef = ref(database, chatDbPath);

            onChildAdded(currentChatRef, (snapshot) => {
                const data = snapshot.val();
                renderSingleMessage(data, snapshot.key);
            });
        }

        function renderSingleMessage(data, msgId) {
            const row = document.createElement('div');
            row.className = `message-row ${data.author === currentUser ? 'my-msg' : ''}`;

            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'msg-avatar';
            renderAvatar(avatarDiv, data.avatar);

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';

            let replyHTML = '';
            if (data.replyTo) {
                replyHTML = `
                    <div class="reply-preview-bubble">
                        <div class="reply-author">${data.replyTo.author}</div>
                        <div>${data.replyTo.text}</div>
                    </div>
                `;
            }

            let textContent = data.text;
            let gameHTML = '';
            const hasPlayed = playedGames.includes(msgId);

            // 1. КАЗИНО 🎰
            if (textContent.trim() === '🎰') {
                const gameId = 'game-' + msgId;
                gameHTML = `
                    <div class="interactive-box" id="box-${gameId}">
                        <div class="game-display" id="${gameId}">🎰 🎰 🎰</div>
                        <div class="game-status" id="${gameId}-status">...</div>
                    </div>
                `;
                textContent = '';
                setTimeout(() => handleCasinoLogic(gameId, data.gameResult, msgId, hasPlayed), 100);
            }

            // 2. ФУТБОЛ ⚽
            if (textContent.trim() === '⚽') {
                const gameId = 'game-' + msgId;
                gameHTML = `
                    <div class="interactive-box" id="box-${gameId}">
                        <div class="game-display" id="${gameId}">🥅 🧤 ⚽</div>
                        <div class="game-status" id="${gameId}-status">Удар...</div>
                    </div>
                `;
                textContent = '';
                setTimeout(() => handleFootballLogic(gameId, data.gameResult, msgId, hasPlayed), 100);
            }

            bubble.innerHTML = `
                <div class="msg-author">${data.author}</div>
                ${replyHTML}
                <div>${textContent}</div>
                ${gameHTML}
                <div class="msg-time">${data.time}</div>
            `;

            row.appendChild(avatarDiv);
            row.appendChild(bubble);

            // Клик на игру вызывает меню с кнопкой "Отправить ещё раз"
            if (data.text.trim() === '🎰' || data.text.trim() === '⚽') {
                setTimeout(() => {
                    const box = document.getElementById('box-game-' + msgId);
                    if (box) {
                        box.addEventListener('click', (e) => {
                            e.stopPropagation();
                            showRepeatMenu(data.text.trim(), data.author);
                        });
                    }
                }, 150);
            }

            attachSwipeToReply(row, data);

            chatMessages.appendChild(row);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // АНИМАЦИЯ КАЗИНО 🎰
        function handleCasinoLogic(id, finalResult, msgId, hasPlayed) {
            const reelsEl = document.getElementById(id);
            const statusEl = document.getElementById(id + '-status');
            if (!reelsEl || !finalResult) return;

            const updateStatus = (res) => {
                if (res[0] === '7️⃣' && res[1] === '7️⃣' && res[2] === '7️⃣') statusEl.innerText = "💥 ДЖЕКПОТ! 777 💥";
                else if (res[0] === res[1] && res[1] === res[2]) statusEl.innerText = "🎉 ВЫИГРЫШ!";
                else statusEl.innerText = "❌ Не повезло!";
            };

            if (hasPlayed) {
                reelsEl.innerText = `${finalResult[0]} ${finalResult[1]} ${finalResult[2]}`;
                updateStatus(finalResult);
                return;
            }

            statusEl.innerText = "Крутим...";
            const symbols = ['🍋', '🍒', '7️⃣', '🍇'];
            let ticks = 0;

            const interval = setInterval(() => {
                reelsEl.innerText = `${symbols[Math.floor(Math.random()*4)]} ${symbols[Math.floor(Math.random()*4)]} ${symbols[Math.floor(Math.random()*4)]}`;
                ticks++;
                if (ticks > 15) {
                    clearInterval(interval);
                    reelsEl.innerText = `${finalResult[0]} ${finalResult[1]} ${finalResult[2]}`;
                    updateStatus(finalResult);
                    savePlayedGame(msgId);
                }
            }, 80);
        }

        // АНИМАЦИЯ ФУТБОЛА ⚽
        function handleFootballLogic(id, finalResult, msgId, hasPlayed) {
            const displayEl = document.getElementById(id);
            const statusEl = document.getElementById(id + '-status');
            if (!displayEl || !finalResult) return;

            const updateStatus = (isGoal) => {
                statusEl.innerText = isGoal ? "🎯 ГОЛ!!!" : "❌ СЕЙВ ВРАТАРЯ!";
            };

            if (hasPlayed) {
                displayEl.innerText = finalResult.isGoal ? "🥅 ⚽ 🧤" : "🥅 🧤⚽";
                updateStatus(finalResult.isGoal);
                return;
            }

            statusEl.innerText = "Удар...";
            let frames = ["🥅 ⚽  🧤", "🥅  ⚽ 🧤", "🥅   ⚽🧤"];
            let step = 0;

            const interval = setInterval(() => {
                displayEl.innerText = frames[step % frames.length];
                step++;

                if (step > 10) {
                    clearInterval(interval);
                    displayEl.innerText = finalResult.isGoal ? "🥅 ⚽ 🧤" : "🥅 🧤⚽";
                    updateStatus(finalResult.isGoal);
                    savePlayedGame(msgId);
                }
            }, 120);
        }

        function savePlayedGame(msgId) {
            playedGames.push(msgId);
            localStorage.setItem('idi_played_games', JSON.stringify(playedGames));
        }

        // Показ кнопки "Отправить ещё раз"
        function showRepeatMenu(emoji, author) {
            gameToRepeat = emoji;
            selectedReplyMsg = null;
            document.getElementById('replyBarAuthor').innerText = author;
            document.getElementById('replyBarText').innerText = `Интерактивный эмодзи ${emoji}`;
            repeatGameBtn.style.display = 'block';
            replyBar.classList.add('active');
        }

        repeatGameBtn.addEventListener('click', () => {
            if (gameToRepeat) {
                sendDirectMessage(gameToRepeat);
                cancelReply();
            }
        });

        // Свайп влево для ответа
        function attachSwipeToReply(rowElement, msgData) {
            let startX = 0, currentX = 0, isSwiping = false;

            const startSwipe = (x) => { startX = x; isSwiping = true; };
            const moveSwipe = (x) => {
                if (!isSwiping) return;
                const diffX = x - startX;
                if (diffX < 0 && diffX > -100) {
                    currentX = diffX;
                    rowElement.style.transform = `translateX(${currentX}px)`;
                }
            };
            const endSwipe = () => {
                if (!isSwiping) return;
                isSwiping = false;
                rowElement.style.transform = `translateX(0px)`;
                if (currentX < -50) setReplyMessage(msgData);
                currentX = 0;
            };

            rowElement.addEventListener('touchstart', (e) => startSwipe(e.touches[0].clientX));
            rowElement.addEventListener('touchmove', (e) => moveSwipe(e.touches[0].clientX));
            rowElement.addEventListener('touchend', endSwipe);

            rowElement.addEventListener('mousedown', (e) => startSwipe(e.clientX));
            window.addEventListener('mousemove', (e) => moveSwipe(e.clientX));
            window.addEventListener('mouseup', endSwipe);
        }

        function setReplyMessage(msgData) {
            selectedReplyMsg = msgData;
            gameToRepeat = null;
            repeatGameBtn.style.display = 'none';
            document.getElementById('replyBarAuthor').innerText = msgData.author;
            document.getElementById('replyBarText').innerText = msgData.text || 'Игра';
            replyBar.classList.add('active');
            document.getElementById('userInput').focus();
        }

        function cancelReply() {
            selectedReplyMsg = null;
            gameToRepeat = null;
            repeatGameBtn.style.display = 'none';
            replyBar.classList.remove('active');
        }

        document.getElementById('cancelReplyBtn').addEventListener('click', cancelReply);

        function sendDirectMessage(text) {
            if (!text || !currentUser) return;
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            let chatDbPath = 'global_chat';
            if (activeChatId !== 'global') {
                const pair = [currentUser, activeChatId].sort().join('_');
                chatDbPath = 'private_chats/' + pair;
            }

            const msgObject = {
                author: currentUser,
                avatar: currentAvatar,
                text: text,
                time: time
            };

            // Генерация результатов
            if (text === '🎰') {
                const symbols = ['🍋', '🍒', '7️⃣', '🍇'];
                msgObject.gameResult = [
                    symbols[Math.floor(Math.random() * 4)],
                    symbols[Math.floor(Math.random() * 4)],
                    symbols[Math.floor(Math.random() * 4)]
                ];
            } else if (text === '⚽') {
                msgObject.gameResult = { isGoal: Math.random() > 0.5 };
            }

            if (selectedReplyMsg) {
                msgObject.replyTo = {
                    author: selectedReplyMsg.author,
                    text: selectedReplyMsg.text || 'Игра'
                };
            }

            push(ref(database, chatDbPath), msgObject);
        }

        // Форма отправки
        document.getElementById('chatForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('userInput');
            const text = input.value.trim();

            if (text) {
                sendDirectMessage(text);
                input.value = '';
                cancelReply();
            }
        });

        // Навигация
        document.getElementById('globalChatItem').addEventListener('click', () => {
            document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
            document.getElementById('globalChatItem').classList.add('active');
            openChat('global', 'Общий чат страны', '📢');
        });

        document.getElementById('backBtn').addEventListener('click', () => {
            messenger.classList.remove('open-chat');
        });

        const drawer = document.getElementById('sidebarDrawer');
        const overlay = document.getElementById('drawerOverlay');

        document.getElementById('openMenuBtn').addEventListener('click', () => {
            drawer.classList.add('active');
            overlay.classList.add('active');
            document.getElementById('setAvatarInput').value = currentAvatar;
        });

        overlay.addEventListener('click', () => {
            drawer.classList.remove('active');
            overlay.classList.remove('active');
        });

        document.getElementById('saveAvatarBtn').addEventListener('click', async () => {
            currentAvatar = document.getElementById('setAvatarInput').value.trim() || '🐱';
            localStorage.setItem('idi_avatar', currentAvatar);
            await set(ref(database, 'users/' + currentUser), { avatar: currentAvatar });
            renderAvatar(document.getElementById('drawerAvatar'), currentAvatar);
            drawer.classList.remove('active');
            overlay.classList.remove('active');
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.clear();
            location.reload();
        });

        if (currentUser) initApp();
    </script>
</body>
</html>
